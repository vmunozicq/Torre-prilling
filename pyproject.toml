[project]
name = "prilling"
version = "0.1.0"
description = "Torre de prilling: enfriamiento y solidificación de gotas y PSD del producto (portafolio de Vicente Muñoz)"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vicente Muñoz" }]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501", "E702"]
"app/*" = ["E501"]
